<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcel Simulator</title>
<style>
  :root {
    --u: min(1.05vw, 1.85vh);
    --fs-day:     max(13px,   calc(var(--u) * .72));
    --fs-chip:    max(11.5px, calc(var(--u) * .68));
    --fs-label:   max(10px,   calc(var(--u) * .62));
    --fs-hint:    max(10px,   calc(var(--u) * .58));
    --fs-lang:    max(12px,   calc(var(--u) * .7));
    --fs-menu:    max(13px,   calc(var(--u) * .72));
    --fs-caption: max(10.5px, calc(var(--u) * .6));
    --fs-country: max(11px,   calc(var(--u) * .74));
    --fs-kg:      max(10.5px, calc(var(--u) * .64));
    --touch: 0px;
    --bg:      #0a0a0a;
    --panel:   #161616;
    --panel-2: #1e1e1e;
    --line:    #303030;
    --line-2:  #272727;
    --text:    #f4f4f4;
    --muted:   #8e8e8e;
    --hi:      #e8b93b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  img, svg { display: block; }
  #app {
    height: 100%;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: calc(var(--u) * .55);
    padding: calc(var(--u) * .6);
  }
  #bar {
    display: flex;
    align-items: stretch;
    gap: calc(var(--u) * .7);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: calc(var(--u) * .5);
    padding: calc(var(--u) * .45) calc(var(--u) * .7);
    min-height: 0;
  }
  .bar-label {
    font-size: var(--fs-label);
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  #days {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * .22);
    flex: none;
  }
  #days button {
    font: inherit;
    font-size: var(--fs-day);
    min-height: var(--touch);
    font-weight: 800;
    letter-spacing: .06em;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--line-2);
    border-radius: calc(var(--u) * .3);
    padding: calc(var(--u) * .3) calc(var(--u) * .55);
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  #days button:hover { color: var(--text); border-color: #4a4a4a; }
  #days button[aria-pressed="true"] {
    background: var(--hi);
    border-color: var(--hi);
    color: #1a1400;
  }
  #days button:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
  .sep { width: 1px; background: var(--line-2); flex: none; }
  #offered {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: calc(var(--u) * .8);
    overflow: hidden;
  }
  #offered .chip {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * .32);
    white-space: nowrap;
  }
  #offered .chip img { height: calc(var(--u) * 1.35); width: auto; }
  #offered .chip span {
    font-size: var(--fs-chip);
    font-weight: 800;
    letter-spacing: .06em;
  }
  #offered .empty { font-size: var(--fs-chip); color: var(--muted); }
  #offered .bar-hint {
    flex: 1 1 auto;
    min-width: 0;
    font-size: var(--fs-hint);
    font-style: normal;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-inline-start: calc(var(--u) * .3);
  }
  #lang { position: relative; flex: none; display: flex; align-items: center; }
  #lang > button {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * .4);
    font: inherit;
    font-size: var(--fs-lang);
    min-height: var(--touch);
    font-weight: 700;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line-2);
    border-radius: calc(var(--u) * .3);
    padding: calc(var(--u) * .28) calc(var(--u) * .5);
    cursor: pointer;
  }
  #lang > button:hover { border-color: #4a4a4a; }
  #lang > button:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
  #lang .caret { font-size: max(10px, calc(var(--u) * .5)); color: var(--muted); }
  .flag {
    width: calc(var(--u) * 1.5);
    height: calc(var(--u) * 1);
    border-radius: 2px;
    outline: 1px solid rgba(255, 255, 255, .18);
    outline-offset: -1px;
    flex: none;
  }
  #langMenu {
    position: absolute;
    top: calc(100% + var(--u) * .35);
    right: 0;
    z-index: 20;
    background: #1c1c1c;
    border: 1px solid var(--line);
    border-radius: calc(var(--u) * .4);
    box-shadow: 0 calc(var(--u) * .6) calc(var(--u) * 1.6) rgba(0, 0, 0, .65);
    padding: calc(var(--u) * .25);
    display: none;
    max-height: 78vh;
    overflow-y: auto;
  }
  #langMenu.open { display: block; }
  #langMenu button {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * .45);
    width: 100%;
    font: inherit;
    font-size: var(--fs-menu);
    min-height: var(--touch);
    color: var(--text);
    background: none;
    border: 0;
    border-radius: calc(var(--u) * .28);
    padding: calc(var(--u) * .34) calc(var(--u) * .7) calc(var(--u) * .34) calc(var(--u) * .4);
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
  }
  #langMenu button:hover { background: #2a2a2a; }
  #langMenu button[aria-current="true"] { color: var(--hi); font-weight: 700; }
  main {
    display: grid;
    gap: calc(var(--u) * .55);
    min-height: 0;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.02fr);
    grid-template-rows: minmax(0, 1.18fr) minmax(0, .84fr) minmax(0, .92fr);
    grid-template-areas:
      "items  countries"
      "stamps  countries"
      "weights countries";
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: calc(var(--u) * .5);
    padding: calc(var(--u) * .5) calc(var(--u) * .8) calc(var(--u) * .7);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .card > h2 {
    flex: none;
    display: flex;
    align-items: baseline;
    gap: calc(var(--u) * .6);
    font-size: calc(var(--u) * .84);
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding-bottom: calc(var(--u) * .3);
    margin-bottom: calc(var(--u) * .45);
    border-bottom: 1px solid var(--line-2);
    white-space: nowrap;
    overflow: hidden;
  }
  .card > h2 em {
    font-size: calc(var(--u) * .58);
    font-weight: 600;
    font-style: normal;
    letter-spacing: .02em;
    text-transform: none;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .a-items     { grid-area: items; }
  .a-stamps    { grid-area: stamps; }
  .a-weights   { grid-area: weights; }
  .a-countries { grid-area: countries; }
  .fill {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .frame {
    width: 100%;
    max-height: 100%;
    aspect-ratio: 318 / 188;
    margin-inline: auto;
    overflow: hidden;
  }
  .frame img { width: 100%; height: 100%; }
  .fit {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
  }
  .items {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: calc(var(--u) * .4);
  }
  .items figure {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    justify-items: center;
    gap: calc(var(--u) * .25);
    min-height: 0;
    min-width: 0;
  }
  .items figure > .fit { align-self: center; }
  .items figcaption {
    font-size: var(--fs-caption);
    font-weight: 700;
    line-height: 1.25;
    text-align: center;
    overflow: hidden;
  }
  .strip {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: calc(var(--u) * .45);
    justify-items: center;
  }
  .strip .cell {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    justify-items: center;
    gap: calc(var(--u) * .2);
    min-height: 0;
    min-width: 0;
    width: 100%;
    max-width: calc(var(--u) * 14);
  }
  .strip .cell > .fill { border-radius: calc(var(--u) * .18); }
  .strip .kg {
    font-size: var(--fs-kg);
    font-weight: 800;
    color: var(--muted);
    white-space: nowrap;
  }
  .countries {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(4, minmax(0, 1fr));
    gap: calc(var(--u) * .45) calc(var(--u) * .55);
    align-content: center;
  }
  .land {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: calc(var(--u) * .18);
    min-height: 0;
    min-width: 0;
  }
  .land b {
    font-size: var(--fs-country);
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .land .frame {
    max-width: calc(var(--u) * 34);
    border: 1px solid #2b2b2b;
    border-radius: calc(var(--u) * .15);
    align-self: start;
  }
  @media (max-aspect-ratio: 23/20) {
    :root { --u: min(2.3vw, 1.35vh); }
    main {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1.1fr) minmax(0, 2.2fr) minmax(0, .85fr) minmax(0, .9fr);
      grid-template-areas: "items" "countries" "stamps" "weights";
    }
    #bar { flex-wrap: wrap; }
  }
  @media (min-aspect-ratio: 2/1) {
    :root { --u: min(.72vw, 1.85vh); }
  }
  @media (max-width: 720px), (max-height: 520px) {
    :root { --touch: 42px; }
    #app  { gap: 6px; padding: 6px; }
    #bar  { flex-wrap: wrap; gap: 6px; padding: 6px; border-radius: 8px; }
    .card { padding: 7px 8px 8px; border-radius: 8px; }
    .card > h2 { display: none; }
    #days { flex: 1 1 100%; gap: 4px; }
    #days button {
      flex: 1 1 0;
      min-width: 0;
      padding: 0 2px;
      letter-spacing: 0;
      border-radius: 6px;
    }
    .sep { display: none; }
    #offered { gap: 10px; }
    #offered .bar-label,
    #offered .bar-hint { display: none; }
    #offered .chip img { height: 22px; }
    #lang > button { min-width: var(--touch); justify-content: center; border-radius: 6px; }
    #lang > button .lang-name { display: none; }
    .flag { width: 26px; height: 17px; }
    #langMenu button { gap: 10px; padding: 0 14px 0 8px; }
    .items { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .strip { gap: 8px; }
    .strip .cell { max-width: 110px; }
  }
  @media (max-width: 720px) and (max-aspect-ratio: 23/20) {
    main {
      grid-template-rows: minmax(0, 1.35fr) minmax(0, 2.4fr) auto auto;
    }
  }
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div id="days" role="group"></div>
    <div class="sep"></div>
    <div id="offered"></div>
    <div id="lang">
      <button id="langBtn" aria-haspopup="true" aria-expanded="false"></button>
      <div id="langMenu" role="menu"></div>
    </div>
  </header>
  <main>
    <section class="card a-items">
      <h2><span data-t="forbidden"></span><em data-t="forbiddenHint"></em></h2>
      <div class="items" id="items"></div>
    </section>
    <section class="card a-stamps">
      <h2><span data-t="stamps"></span><em data-t="stampsHint"></em></h2>
      <div class="strip" id="stamps"></div>
    </section>
    <section class="card a-weights">
      <h2><span data-t="weights"></span><em data-t="weightsHint"></em></h2>
      <div class="strip" id="weights"></div>
    </section>
    <section class="card a-countries">
      <h2><span data-t="countries"></span><em data-t="countriesHint"></em></h2>
      <div class="countries" id="countries"></div>
    </section>
  </main>
</div>
<script src="i18n.js"></script>
<script src="flags.js"></script>
<script>
const FREIGHT = [
  { id: 'lkw',      key: 'truck', days: [1, 1, 1, 1, 1, 1, 1] },
  { id: 'zug',      key: 'train', days: [1, 1, 1, 1, 1, 0, 0] },
  { id: 'flugzeug', key: 'plane', days: [0, 0, 1, 0, 1, 0, 0] },
  { id: 'schiff',   key: 'ship',  days: [0, 1, 0, 0, 0, 0, 0] }
];
const ITEMS = [
  ['chemikalien', 'iChem'], ['gaskanister', 'iGas'], ['batterien', 'iBat'],
  ['bargeld', 'iCash'], ['messer', 'iKnife']
];
const COUNTRIES = [
  'Cristin', 'Impland', 'Jonathia', 'Kongradi', 'Ligbal', 'Mahteen',
  'Molland', 'Pruania', 'Sowport', 'Strentom', 'Vocua', 'Yatdanica'
];
const WEIGHTS = [['a', 5], ['b', 10], ['c', 15], ['d', 20], ['e', 30]];
const asset = name => (window.ASSETS && window.ASSETS[name]) || 'assets/' + name;
const store = {
  get(k, fallback) { try { return localStorage.getItem(k) || fallback; } catch (e) { return fallback; } },
  set(k, v)        { try { localStorage.setItem(k, v); } catch (e) { } }
};
function detectLang() {
  const saved = store.get('psh.lang', '');
  if (I18N[saved]) return saved;
  for (const tag of (navigator.languages || [navigator.language || 'de'])) {
    const low = tag.toLowerCase();
    if (low.startsWith('pt')) return 'pt-BR';
    if (low.startsWith('zh')) return 'zh';
    if (low.startsWith('es')) return /(es|419)$/.test(low) && low !== 'es-es' ? 'es-419' : 'es';
    const base = low.split('-')[0];
    if (I18N[base]) return base;
  }
  return 'de';
}
let lang = detectLang();
let day = parseInt(store.get('psh.day', '0'), 10);
if (!(day >= 0 && day <= 6)) day = 0;
const el = id => document.getElementById(id);
const t = () => I18N[lang];
function renderStatic() {
  const L = t();
  document.documentElement.lang = lang;
  document.title = 'Parcel Simulator — ' + L.title;
  document.querySelectorAll('[data-t]').forEach(n => { n.textContent = L[n.dataset.t]; });
  el('items').innerHTML = ITEMS.map(([id, key]) => `
    <figure>
      <img class="fit" src="${asset('item-' + id + '.png')}" alt="">
      <figcaption>${L[key]}</figcaption>
    </figure>`).join('');
  el('stamps').innerHTML = [1, 2, 3, 4, 5].map(n => `
    <div class="cell"><img class="fill" src="${asset('stamp-' + n + '.png')}" alt=""></div>`).join('');
  el('weights').innerHTML = WEIGHTS.map(([id, kg]) => `
    <div class="cell">
      <img class="fill" src="${asset('weight-' + id + '.png')}" alt="${id.toUpperCase()}">
      <span class="kg">0 – ${kg} kg</span>
    </div>`).join('');
  el('countries').innerHTML = COUNTRIES.map(n => `
    <div class="land">
      <b>${n}</b>
      <div class="frame"><img src="${asset('flag-' + n.toLowerCase() + '.png')}" alt="${n}"></div>
    </div>`).join('');
  el('days').innerHTML = L.days.map((d, i) =>
    `<button type="button" data-day="${i}" aria-pressed="${i === day}">${d}</button>`).join('');
  el('langBtn').innerHTML =
    flagSvg(L.flag) + `<span class="lang-name">${L.name}</span><span class="caret">▾</span>`;
  el('langBtn').setAttribute('aria-label', L.language + ': ' + L.name);
  el('langMenu').innerHTML = Object.entries(I18N).map(([code, v]) =>
    `<button type="button" role="menuitem" data-lang="${code}"
       aria-current="${code === lang}">${flagSvg(v.flag)}<span>${v.name}</span></button>`).join('');
}
function renderDay() {
  const L = t();
  el('days').querySelectorAll('button').forEach(b => {
    b.setAttribute('aria-pressed', String(+b.dataset.day === day));
  });
  const active = FREIGHT.filter(f => f.days[day]);
  el('offered').innerHTML =
    `<span class="bar-label">${L.shipping}</span>` +
    (active.length
      ? active.map(f =>
          `<span class="chip"><img src="${asset('icon-' + f.id + '.png')}" alt=""><span>${L[f.key]}</span></span>`).join('')
      : `<span class="empty">${L.none}</span>`) +
    `<em class="bar-hint">${L.shippingHint}</em>`;
}
const FLAG_AR = 318 / 188;
function layoutCountries() {
  const g = el('countries');
  const land = g.querySelector('.land');
  if (!land) return;
  const gs = getComputedStyle(g);
  const gx = parseFloat(gs.columnGap) || 0;
  const gy = parseFloat(gs.rowGap) || 0;
  const W = g.clientWidth;
  const H = g.clientHeight;
  const ls = getComputedStyle(land);
  const nameH = land.querySelector('b').getBoundingClientRect().height +
                (parseFloat(ls.rowGap) || 0);
  let best = null;
  for (const cols of [2, 3, 4, 6]) {
    const rows = Math.ceil(COUNTRIES.length / cols);
    const byWidth  = (W - (cols - 1) * gx) / cols;
    const byHeight = ((H - (rows - 1) * gy) / rows - nameH) * FLAG_AR;
    const w = Math.min(byWidth, byHeight);
    if (!best || w > best.w) best = { cols, rows, w };
  }
  g.style.gridTemplateColumns = `repeat(${best.cols}, minmax(0, 1fr))`;
  g.style.gridTemplateRows = `repeat(${best.rows}, minmax(0, 1fr))`;
}
el('days').addEventListener('click', e => {
  const b = e.target.closest('button[data-day]');
  if (!b) return;
  day = +b.dataset.day;
  store.set('psh.day', String(day));
  renderDay();
});
el('langBtn').addEventListener('click', e => {
  e.stopPropagation();
  const m = el('langMenu');
  const open = m.classList.toggle('open');
  el('langBtn').setAttribute('aria-expanded', String(open));
});
el('langMenu').addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]');
  if (!b) return;
  lang = b.dataset.lang;
  store.set('psh.lang', lang);
  el('langMenu').classList.remove('open');
  el('langBtn').setAttribute('aria-expanded', 'false');
  renderStatic();
  renderDay();
  layoutCountries();
});
document.addEventListener('click', () => {
  el('langMenu').classList.remove('open');
  el('langBtn').setAttribute('aria-expanded', 'false');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    el('langMenu').classList.remove('open');
    el('langBtn').setAttribute('aria-expanded', 'false');
  }
});
let wakeLock = null;
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) {}
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    requestWakeLock();
  }
});
requestWakeLock();
document.body.addEventListener('click', () => {
  if (!wakeLock) requestWakeLock();
}, { once: true });
const keepAliveEl = document.createElement('div');
keepAliveEl.style.cssText = 'position:fixed; top:0; left:0; width:1px; height:1px; opacity:0; pointer-events:none; z-index:-1;';
document.body.appendChild(keepAliveEl);
setInterval(() => {
  keepAliveEl.style.opacity = keepAliveEl.style.opacity === '0' ? '0.01' : '0';
}, 30000);
addEventListener('resize', layoutCountries);
renderStatic();
renderDay();
layoutCountries();
</script>
</body>
</html>
